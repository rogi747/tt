name: LineageOS 20.0 - star2lte Full ROM Trial (BuildBuddy RBE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: los20-star2lte-rbe-full-rom-trial
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"

      # The legacy reclient used by this pipeline cannot attach RBE_remote_headers.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # Keep all RBE diagnostics in one place.
      RBE_log_dir: "/tmp/rbe-test"
      RBE_log_path: "text:///tmp/rbe-test/reproxy_log.txt"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "2"

      # Conservative 2-job build parallelism on GitHub hosted runner.
      # Keep memory-intensive actions serial to reduce local memory pressure.
      NINJA_REMOTE_NUM_JOBS: "2"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      # GiB of available disk space (statvfs/df -B1, not rounded df -h).
      DISK_WARN_GIB: "25"
      DISK_STOP_GIB: "15"
      # Stop the long build early enough to upload logs and a successful ROM.
      # Whole-job limit on GitHub-hosted runners: 360 minutes.
      FULL_ROM_SOFT_DEADLINE_MINUTES: "320"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          # Start the total-job clock before dependency install and repo sync.
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          # Persist a clean-runner baseline before package installation/sync.
          # No tokens or secrets are written to this log.
          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los

          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          # P0: remove the oversized multi-version reclient checkout BEFORE sync.
          # -a is required because no worktree has been checked out yet.
          # The pinned toolchain is fetched separately after sync and must be
          # self-contained. Never remove other Android prebuilts here.
          echo "=== P0 RECLIENT PROJECT BEFORE TRIM ==="
          repo list -a -p > /tmp/rbe-test/manifest-projects-before-trim.txt
          if ! grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-before-trim.txt; then
            echo "::error::Expected remoteexecution-client project is missing from the manifest; review before trimming."
            exit 1
          fi

          cat > .repo/local_manifests/zz-storage-trim.xml <<'EOFTRIM'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <remove-project path="prebuilts/remoteexecution-client" optional="true" />
          </manifest>
          EOFTRIM

          repo list -a -p > /tmp/rbe-test/manifest-projects-after-trim.txt
          if grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-after-trim.txt; then
            echo "::error::P0 trim failed: reclient project is still in the effective manifest."
            exit 1
          fi
          repo manifest -o /tmp/rbe-test/effective-manifest-after-trim.xml
          echo 'P0 trim verified: prebuilts/remoteexecution-client will NOT be repo-synced.' \
            | tee /tmp/rbe-test/p0-storage-trim-status.txt

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"
          echo "=== P0 STORAGE TRIM MANIFEST ==="
          cat .repo/local_manifests/zz-storage-trim.xml

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      # Collect post-sync storage attribution while the tree is still clean.
      # This is diagnostic-only and does not mutate .repo, source, or out.
      - name: Profile storage after repo sync
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/disk-analysis.log
          TS=/tmp/rbe-test/resource-samples.tsv
          if [ ! -s "$TS" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          fi

          sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used "$PWD" | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$TS"
          }
          sample post-sync

          {
            echo '=== POST-SYNC DISK ANALYSIS ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo '=== MOUNT POINTS ==='
            df -hT / /mnt /home/runner/work/los
            echo '=== BLOCK DEVICES ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            echo '=== INODES ==='
            df -i /home/runner/work/los
            echo '=== GIT OBJECT STORAGE ==='
            du -sh .repo 2>/dev/null || true
            echo '=== OUTPUT TREE ==='
            du -sh out 2>/dev/null || true
            echo '=== SOURCE TREE - FIRST LEVEL ==='
            du -xhd1 . 2>/dev/null | sort -h | tail -n 50 || true
            echo '=== RUNNER SYSTEM FOOTPRINT ==='
            # Avoid scanning /home/runner/work twice (large Android checkout).
            sudo du -xhd1 /opt /usr/local /var 2>/dev/null | sort -h | tail -n 35 || true
            du -sh /home/runner/.cache /home/runner/.local /home/runner/.cargo \
              2>/dev/null || true
            echo '=== MEMORY ==='
            free -h
            echo '=== AVAILABLE DISK (BYTES) ==='
            df -B1 --output=source,size,used,avail,pcent,target /home/runner/work/los
          } 2>&1 | tee "$LOG"

          # Detail the largest checked-out prebuilts and repo metadata.
          # Diagnostic-only: never delete, prune, or mutate Android sources.
          echo '=== PREBUILTS STORAGE BREAKDOWN ==='
          if [ -d prebuilts ]; then
            du -xhd1 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-size.log || true
            du -xhd2 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-detail.log || true
            echo '--- PREBUILTS LEVEL 1 ---'
            tail -n 60 /tmp/rbe-test/prebuilts-size.log || true
            echo '--- PREBUILTS LEVEL 2 (LARGEST 80) ---'
            tail -n 80 /tmp/rbe-test/prebuilts-detail.log || true
          else
            echo '::warning::prebuilts directory was not found.'
          fi

          echo '=== REPO METADATA STORAGE BREAKDOWN ==='
          if [ -d .repo ]; then
            du -xhd2 .repo 2>/dev/null | sort -h \
              > /tmp/rbe-test/repo-size.log || true
            echo '--- REPO METADATA (LARGEST 40) ---'
            tail -n 40 /tmp/rbe-test/repo-size.log || true
          else
            echo '::warning::.repo directory was not found.'
          fi
          # Deep-dive into the largest storage groups from previous runs.
          # Never delete source, prebuilts, .repo objects, or installed tools.
          echo '=== CLANG TOOLCHAIN VERSION BREAKDOWN ==='
          if [ -d prebuilts/clang ]; then
            du -xhd4 prebuilts/clang 2>/dev/null | sort -h \
              > /tmp/rbe-test/clang-detail.log || true
            echo '--- CLANG LARGEST 35 ---'
            tail -n 35 /tmp/rbe-test/clang-detail.log || true
            find prebuilts/clang/host -mindepth 2 -maxdepth 2 \
              -type d -name 'clang-*' -print 2>/dev/null | sort \
              > /tmp/rbe-test/clang-versions.log || true
          else
            echo '::warning::prebuilts/clang missing'
          fi

          echo '=== GRADLE PLUGIN BREAKDOWN ==='
          if [ -d prebuilts/gradle-plugin ]; then
            du -xhd4 prebuilts/gradle-plugin 2>/dev/null | sort -h \
              > /tmp/rbe-test/gradle-detail.log || true
            tail -n 25 /tmp/rbe-test/gradle-detail.log || true
          fi

          echo '=== PLATFORM GIT OBJECT BREAKDOWN ==='
          if [ -d .repo/project-objects/platform ]; then
            du -xhd4 .repo/project-objects/platform 2>/dev/null | sort -h \
              > /tmp/rbe-test/platform-objects-detail.log || true
            tail -n 35 /tmp/rbe-test/platform-objects-detail.log || true
          fi

          echo '=== MANIFEST PREBUILTS PROJECT PATHS ==='
          # A candidate inventory only: NEVER change the synced manifest.
          repo list -p 2> /tmp/rbe-test/prebuilts-projects-errors.log \
            | grep -E '^prebuilts(/|$)' \
            > /tmp/rbe-test/prebuilts-projects.log || true
          echo "Registered prebuilts projects: $(wc -l < /tmp/rbe-test/prebuilts-projects.log)"
          sed -n '1,120p' /tmp/rbe-test/prebuilts-projects.log || true
          sample post-deep-storage-profile

          echo '=== DEEP STORAGE BASELINE COMPLETE ==='

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Reclient 0.25 (2021) predates the Remote Execution API fix for
      # working-directory-relative output paths (SDK fix Nov 2021).
      # Pin a coherent prebuilt release rather than mixing rewrapper/reproxy.
      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Use one coherent pinned release, without any fallback into a
          # repo-synced "live" tree. Copying the whole pinned directory also
          # keeps dependency scanner libraries and symlinks from this release.
          test -d "$FETCH_DIR/$PINNED_VERSION"
          cp -a "$FETCH_DIR/$PINNED_VERSION/." "$DEST/"
          for bin in rewrapper reproxy bootstrap; do
            test -s "$DEST/$bin"
            test -x "$DEST/$bin" || chmod 0755 "$DEST/$bin"
          done
          # The one-time shallow/sparse clone is no longer needed during build.
          rm -rf "$FETCH_DIR"

          echo '=== P0 PINNED RECLIENT STORAGE ==='
          du -sh "$DEST" prebuilts/remoteexecution-client 2>/dev/null \
            | tee /tmp/rbe-test/p0-reclient-size.txt
          if [ -e prebuilts/remoteexecution-client/live ]; then
            echo '::error::Unexpected repo-synced reclient/live directory; P0 trim was bypassed.'
            exit 1
          fi
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" 'post-pinned-reclient' \
            "$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" \
            >> /tmp/rbe-test/resource-samples.tsv

          printf 'pinned_commit=%s\npinned_version=%s\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

      - name: Inspect Android reclient
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== RECLIENT DIRECTORY ==="
          ls -lah "$RBE_DIR"

          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/bootstrap"

          echo "=== RBE DEPENDENCY SCANNER ==="
          if [ -f "$RBE_DIR/dependency_scanner_go_plugin.so" ]; then
            echo "dependency_scanner_go_plugin.so found."
          else
            echo "::warning::dependency_scanner_go_plugin.so not found in $RBE_DIR."
          fi
          if [ -x "$RBE_DIR/scandeps_server" ]; then
            echo "scandeps_server found."
          else
            echo "::notice::scandeps_server not found (may be absent in older reclient builds)."
          fi

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."

          echo "=== BUILD BUDDY TLS CHAIN DIAGNOSTIC ==="
          TLS_LOG="/tmp/rbe-test/buildbuddy-tls-check.log"
          mkdir -p /tmp/rbe-test
          if ! timeout 20 openssl s_client \
            -connect remote.buildbuddy.io:443 \
            -servername remote.buildbuddy.io \
            -verify_hostname remote.buildbuddy.io \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > "$TLS_LOG" 2>&1; then
            echo "::warning::OpenSSL certificate precheck returned an error; see artifact."
          fi
          grep -E 'Verification:|Verify return code:|verify error:|Verification error:|^subject=|^issuer=' "$TLS_LOG" | tail -30 || true

          echo "Authentication will be validated by the real reclient compile below."

      - name: Start authenticated BuildBuddy gRPC bridge
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # This is needed for Android 11's old reclient which cannot attach
          # custom gRPC metadata. The only cleartext hop is loopback.
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          umask 077

          # Never write the secret into workflow logs, a command argument,
          # or the uploaded /tmp/rbe-test artifact directory.
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path

          secret = os.environ['BUILDBUDDY_API_KEY']
          if not secret or any(ch in secret for ch in ('\n', '\r', '\x00')):
              raise SystemExit('Invalid BuildBuddy API key format')

          # Escape an nginx double-quoted string safely.
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          error_log /tmp/rbe-test/buildbuddy-grpc-errors.log warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_max_body_size 0;
            server {
              listen 127.0.0.1:19099 http2;
              server_name localhost;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                # Android 11 bridge: allow intermediate CAs in the TLS chain.
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_connect_timeout 30s;
                grpc_read_timeout 300s;
                grpc_send_timeout 300s;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE

          nginx -t -c "$BRIDGE_DIR/nginx.conf"
          nginx -c "$BRIDGE_DIR/nginx.conf"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/19099) >/dev/null 2>&1; then
              echo "BuildBuddy local gRPC bridge is listening on 127.0.0.1:19099."
              exit 0
            fi
            sleep 1
          done
          echo "::error::BuildBuddy gRPC bridge failed to start."
          exit 1

      - name: Configure Lineage and build full star2lte ROM via BuildBuddy
        working-directory: /home/runner/work/los
        # The 320-minute job-clock guard below leaves time for cleanup/upload.
        timeout-minutes: 325
        shell: bash
        run: |
          set -Eeo pipefail
          mkdir -p /tmp/rbe-test

          # P0.1: capture early setup output, even when envsetup or lunch fails
          # before m-nothing.log / rbe-env.txt can be created.
          # Preserve Actions stdout/stderr to avoid duplicating long build logs.
          exec 3>&1 4>&2
          exec > >(tee -a /tmp/rbe-test/configure-setup.log) 2>&1
          CURRENT_STAGE=configure-start
          LAST_FAILURE_LINE=''
          LAST_FAILURE_COMMAND=''
          BUILD_PID=''
          mark_stage() {
            CURRENT_STAGE="$1"
            printf '[%s] STAGE: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$CURRENT_STAGE" \
              | tee -a /tmp/rbe-test/configure-stages.log
          }
          on_error() {
            LAST_FAILURE_LINE="$1"
            LAST_FAILURE_COMMAND="$2"
            # Never enable set -x: BuildBuddy credentials are in the environment.
            printf 'Failure observed at line=%s in stage=%s\n' "$LAST_FAILURE_LINE" "$CURRENT_STAGE"
          }
          on_exit() {
            local rc=$?
            trap - EXIT
            # Retain the original process-tree cleanup if build is interrupted.
            if [ -n "${BUILD_PID:-}" ] && kill -0 "$BUILD_PID" 2>/dev/null; then
              if declare -F stop_process_tree >/dev/null; then
                stop_process_tree "$BUILD_PID" || true
              fi
            fi
            if [ "$rc" -ne 0 ]; then
              {
                printf 'exit_code=%s\n' "$rc"
                printf 'stage=%s\n' "$CURRENT_STAGE"
                printf 'error_line=%s\n' "${LAST_FAILURE_LINE:-unavailable}"
                printf 'error_command=%s\n' "${LAST_FAILURE_COMMAND:-unavailable}"
                printf 'timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              } > /tmp/rbe-test/configure-failure.txt
              echo "::error::Configure failed: stage=$CURRENT_STAGE exit=$rc line=${LAST_FAILURE_LINE:-unknown}"
              echo '=== FAILURE DISK / MEMORY SNAPSHOT ==='
              df -h /home/runner/work/los || true
              free -h || true
              du -sh out 2>/dev/null || true
            else
              printf 'exit_code=0\nstage=%s\n' "$CURRENT_STAGE" \
                > /tmp/rbe-test/configure-success.txt
            fi
          }
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR
          trap on_exit EXIT
          mark_stage configure-start

          echo "=== DATE / OS / SHELL ==="
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          pwd -P
          bash --version | head -1
          echo "=== JAVA CANDIDATES (NO OVERRIDE YET) ==="
          command -v java || true
          java -version 2>&1 || true
          ls -ld prebuilts/jdk/jdk11/linux-x86 prebuilts/jdk/jdk17/linux-x86 \
            2>/dev/null || true

          # LineageOS 20.0 uses PRODUCT-VARIANT format.
          # TARGET_RELEASE and aosp_target_release are for newer build trees.
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh; check repo sync and working-directory."
            exit 1
          fi
          mark_stage envsetup
          source build/envsetup.sh
          echo '=== ENVSETUP PASSED ==='
          mark_stage lunch
          lunch lineage_star2lte-userdebug
          echo '=== LUNCH PASSED ==='
          mark_stage java-selection

          # Prefer the checked-out JDK 11 if this tree selects it.
          # RBE and Android Soong toolchain remain otherwise unchanged.
          if [ -x "$PWD/prebuilts/jdk/jdk11/linux-x86/bin/java" ]; then
            export JAVA_HOME="$PWD/prebuilts/jdk/jdk11/linux-x86"
            export PATH="$JAVA_HOME/bin:$PATH"
          else
            echo "::warning::Bundled JDK 11 is not present at expected path; build system will select its default JDK."
          fi
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          echo "=== JAVA VERSION ==="
          java -version 2>&1 || true

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"

          if [ -z "${ANDROID_BUILD_TOP:-}" ] || \
             [ "${TARGET_PRODUCT:-}" != "lineage_star2lte" ] || \
             [ "${TARGET_BUILD_VARIANT:-}" != "userdebug" ]; then
            echo "::error::Invalid LineageOS build configuration."
            exit 1
          fi

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          # Keep working_directory non-empty ("los") for BuildBuddy, while
          # upgraded reclient handles output_files relative to that directory.
          export RBE_exec_root="$(dirname "$(pwd -P)")"
          RBE_REL_WORKDIR="$(realpath --relative-to="$RBE_exec_root" "$(pwd -P)")"

          mark_stage rbe-configuration
          echo "=== RBE WORKING DIRECTORY COMPATIBILITY ==="
          echo "RBE_exec_root=$RBE_exec_root"
          echo "RBE_REL_WORKDIR=$RBE_REL_WORKDIR"
          if [ "$RBE_REL_WORKDIR" != "los" ]; then
            echo "::error::Unexpected RBE working directory: $RBE_REL_WORKDIR"
            exit 1
          fi
          if [ ! -d "$RBE_exec_root/$RBE_REL_WORKDIR/bionic" ]; then
            echo "::error::Android source tree is missing under RBE_exec_root."
            exit 1
          fi
          printf 'RBE_exec_root=%s\nRBE_relative_working_dir=%s\n' \
            "$RBE_exec_root" "$RBE_REL_WORKDIR" \
            > /tmp/rbe-test/rbe-working-directory.txt

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_service_no_security=${RBE_service_no_security}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_exec_root=${RBE_exec_root}"
            echo "RBE_relative_working_dir=${RBE_REL_WORKDIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "BuildBuddy auth=loopback nginx gRPC bridge (TLS upstream)"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_log_path=${RBE_log_path}"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_v=${RBE_v}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
          } | tee /tmp/rbe-test/rbe-env.txt

          # Write stage-specific samples for easy comparison, using bytes
          # instead of the rounded df -h values.
          DISK_SAMPLES=/tmp/rbe-test/resource-samples.tsv
          if [ ! -f "$DISK_SAMPLES" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$DISK_SAMPLES"
          fi
          disk_sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used "$PWD" | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$DISK_SAMPLES"
            printf '%s\n' "$available"
          }
          enforce_initial_disk_guard() {
            local stage="$1" available threshold
            available="$(disk_sample "$stage")"
            threshold=$((DISK_STOP_GIB * 1024 * 1024 * 1024))
            if (( available < threshold )); then
              echo "::error::Available disk below ${DISK_STOP_GIB} GiB at ${stage}; refusing to start/continue build."
              df -h /home/runner/work/los
              exit 1
            fi
            echo "=== DISK AT ${stage}: $((available / 1073741824)) GiB free ==="
          }
          enforce_initial_disk_guard pre-graph

          mark_stage build-graph
          # From here m-nothing.log and full-rom-build.log capture build output.
          # Do not mirror many gigabytes of compiler output into configure-setup.log.
          exec 1>&3 2>&4
          exec 3>&- 4>&-
          echo "=== GENERATE BUILD GRAPH ==="
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log
          enforce_initial_disk_guard post-graph

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          mark_stage verify-rbe-graph
          echo "=== VERIFY REWRAPPER IS PRESENT IN GENERATED GRAPH ==="
          : > /tmp/rbe-test/rewrapper-ninja-matches.txt
          FOUND_REWRAPPER=0

          for ninja_file in \
            "$ANDROID_BUILD_TOP/out/soong/build.ninja" \
            "$BUILD_NINJA"; do
            if [ -s "$ninja_file" ]; then
              if grep -n -m 20 -E 'remoteexecution-client/.*/rewrapper|(^|[ /])rewrapper([ "]|$)' \
                "$ninja_file" \
                | tee -a /tmp/rbe-test/rewrapper-ninja-matches.txt; then
                FOUND_REWRAPPER=1
              fi
            fi
          done

          if [ "$FOUND_REWRAPPER" -ne 1 ]; then
            echo "::error::RBE is enabled, but no rewrapper command was found in the generated Ninja graph."
            echo "This means the C/C++ actions are not actually being routed through reclient."
            exit 1
          fi

          # Reclient 0.57+ understands working-directory-relative outputs.
          # No rewrapper output-directory shim is installed: the Remote
          # Execution API requires output paths relative to working_directory.
          echo "=== PINNED RECLIENT OUTPUT PATH CHECK ==="
          cat /tmp/rbe-test/reclient-version.txt
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"

          mark_stage pre-build
          echo "=== FULL ROM BUILD: star2lte / bacon ==="
          echo "RBE remote-only enabled; jobs=2, highmem=1, no local ccache."
          echo "The previous libbase test passed; this run compiles and packages the full ROM."
          enforce_initial_disk_guard pre-build

          BUILD_LOG=/tmp/rbe-test/full-rom-build.log
          BUILD_STATUS_FILE=/tmp/rbe-test/build-exit-code.txt
          DISK_TRIP_FILE=/tmp/rbe-test/disk-stop-triggered.txt
          TIME_TRIP_FILE=/tmp/rbe-test/time-stop-triggered.txt
          rm -f "$BUILD_STATUS_FILE" "$DISK_TRIP_FILE" "$TIME_TRIP_FILE"

          if [ -s /tmp/rbe-test/job-start-epoch.txt ]; then
            JOB_START_EPOCH="$(cat /tmp/rbe-test/job-start-epoch.txt)"
          else
            JOB_START_EPOCH="$(date +%s)"
          fi
          SOFT_DEADLINE_EPOCH=$(( JOB_START_EPOCH + FULL_ROM_SOFT_DEADLINE_MINUTES * 60 ))
          echo "=== SOFT DEADLINE (UTC) ==="
          date -u -d "@$SOFT_DEADLINE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ'
          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo "::error::Not enough job time remains to begin full ROM build."
            exit 71
          fi

          mark_stage full-rom-build
          # Run the build in a child shell and keep its exit status after tee.
          # The supervisor retains control to stop on low disk/time.
          (
            set +e
            set -o pipefail
            m -j2 bacon 2>&1 | tee "$BUILD_LOG"
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" > "$BUILD_STATUS_FILE"
            exit "$rc"
          ) &
          BUILD_PID=$!

          stop_process_tree() {
            local pid="$1" child
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              stop_process_tree "$child"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill -TERM "$pid" 2>/dev/null || true
          }
          cleanup_build_supervisor() {
            if kill -0 "$BUILD_PID" 2>/dev/null; then
              stop_process_tree "$BUILD_PID"
            fi
          }
          # The single on_exit trap handles both child cleanup and stage logs.
          echo '=== FULL ROM STORAGE / MEMORY / TIME MONITOR (30s) ==='
          : > /tmp/rbe-test/resource-monitor.log
          WARNED=0
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            avail="$(disk_sample full-rom-sample)"
            now="$(date +%s)"
            free_gib=$((avail / 1073741824))
            mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            seconds_left=$((SOFT_DEADLINE_EPOCH - now))
            line="$(date -u +'%Y-%m-%dT%H:%M:%SZ') free=${free_gib}GiB mem_available=${mem_kib}KiB soft_deadline_remaining=${seconds_left}s"
            echo "$line" | tee -a /tmp/rbe-test/resource-monitor.log

            if (( avail < DISK_STOP_GIB * 1073741824 )); then
              echo "Disk safety stop: available below ${DISK_STOP_GIB} GiB" | tee "$DISK_TRIP_FILE"
              echo "::error::Insufficient disk space; stopping full ROM build."
              stop_process_tree "$BUILD_PID"
              break
            fi
            if (( now >= SOFT_DEADLINE_EPOCH )); then
              echo "Time safety stop: passed ${FULL_ROM_SOFT_DEADLINE_MINUTES} minute whole-job deadline" | tee "$TIME_TRIP_FILE"
              echo "::error::Stopping build before the 6-hour GitHub job limit to preserve diagnostics."
              stop_process_tree "$BUILD_PID"
              break
            fi
            if (( avail < DISK_WARN_GIB * 1073741824 && WARNED == 0 )); then
              echo "::warning::Less than ${DISK_WARN_GIB} GiB remains; full ROM build may be stopped."
              WARNED=1
            fi
            # Wait up to 30 seconds without delaying a completed build.
            for ((tick=0; tick<6; tick++)); do
              kill -0 "$BUILD_PID" 2>/dev/null || break
              sleep 5
            done
          done

          set +e
          wait "$BUILD_PID"
          WAIT_RC=$?
          set -e
          BUILD_PID=''
          BUILD_RC="$WAIT_RC"
          if [ -s "$BUILD_STATUS_FILE" ]; then
            BUILD_RC="$(cat "$BUILD_STATUS_FILE")"
          fi
          if [ -s "$DISK_TRIP_FILE" ]; then BUILD_RC=70; fi
          if [ -s "$TIME_TRIP_FILE" ]; then BUILD_RC=71; fi
          disk_sample post-full-rom-build >/dev/null
          echo "=== FULL ROM BUILD EXIT: $BUILD_RC ==="

          if [ "$BUILD_RC" -ne 0 ]; then
            echo '=== BUILD ERROR LINES (LAST 120 MATCHES) ==='
            grep -anE '(^FAILED:|(^|[[:space:]])error:|No space left on device|Killed|ninja failed|out of memory|missing depfile)' "$BUILD_LOG" 2>/dev/null | tail -n 120 || true
            echo '=== FULL ROM BUILD LOG TAIL ==='
            tail -n 200 "$BUILD_LOG" 2>/dev/null || true
            echo '=== REPROXY STDERR TAIL ==='
            tail -n 100 /tmp/rbe-test/reproxy_outerr.log 2>/dev/null || true
            echo "::error::Full ROM build did not complete (exit $BUILD_RC). See attached diagnostics."
            exit "$BUILD_RC"
          fi

          mark_stage verify-rom-zip
          # A successful Ninja exit alone is not enough: verify flashable ZIP.
          ROM_DIR="$ANDROID_BUILD_TOP/out/target/product/star2lte"
          echo "=== ROM OUTPUT DIRECTORY ==="
          ls -lah "$ROM_DIR" | tail -n 45
          mapfile -d '' -t ROM_ZIPS < <(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -print0)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::bacon succeeded but no lineage-*.zip found in $ROM_DIR"
            exit 1
          fi
          ROM_ZIP="${ROM_ZIPS[0]}"
          if (( ${#ROM_ZIPS[@]} > 1 )); then
            ROM_ZIP="$(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -s "$ROM_ZIP"
          echo "ROM_ZIP=$ROM_ZIP"
          ls -lh "$ROM_ZIP"
          echo "=== CHECK ROM ZIP INTEGRITY ==="
          unzip -tq "$ROM_ZIP" | tail -n 8
          sha256sum "$ROM_ZIP" | tee /tmp/rbe-test/rom-sha256.txt
          basename "$ROM_ZIP" > /tmp/rbe-test/rom-filename.txt
          echo "=== FULL ROM BUILD PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          echo 'Full bacon target completed with remote C++ compilation enabled.'
          mark_stage complete

      - name: Upload completed LineageOS ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-star2lte-${{ github.run_id }}
          path: /home/runner/work/los/out/target/product/star2lte/lineage-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize storage measurements
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          FILE=/tmp/rbe-test/resource-samples.tsv
          {
            echo '## LineageOS 20.0 full ROM trial — disk and RAM'
            echo ''
            echo '| Stage (UTC) | Free GiB | Used GiB | RAM available GiB |'
            echo '|---|---:|---:|---:|'
            if [ -s "$FILE" ]; then
              # Show first/last rows and build low-watermark; no expensive du.
              awk -F '\t' 'NR>1 && NF>=5 {
                free=$3/1073741824; used=$4/1073741824; ram=$5/1048576;
                if (!seen || free<min) {min=free; low=$2 " " $1};
                if ($2!="build-sample" && $2!="full-rom-sample") printf "| %s: %s | %.1f | %.1f | %.1f |\n",$2,$1,free,used,ram;
                seen=1
              } END {
                if(seen) printf "\nLowest observed free disk: **%.1f GiB** at %s.\n",min,low;
                else print "No storage samples recorded."
              }' "$FILE"
            else
              echo '| No measurements | — | — | — |'
            fi
            echo ''
            echo "Disk guard: warning under ${DISK_WARN_GIB} GiB; safe stop under ${DISK_STOP_GIB} GiB."
            if [ -s /tmp/rbe-test/disk-stop-triggered.txt ]; then
              echo '**Guard triggered: build terminated due to low disk.**'
            fi
            echo ''
            echo '### Prebuilts: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/prebuilts-size.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/prebuilts-size.log
              echo '```'
            else
              echo 'No prebuilts breakdown was captured.'
            fi
            echo ''
            echo '### Git repo metadata: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/repo-size.log ]; then
              echo '```text'
              tail -n 12 /tmp/rbe-test/repo-size.log
              echo '```'
            else
              echo 'No .repo breakdown was captured.'
            fi
            echo ''
            echo '### Clang toolchains: largest paths'
            if [ -s /tmp/rbe-test/clang-detail.log ]; then
              echo '```text'
              tail -n 18 /tmp/rbe-test/clang-detail.log
              echo '```'
            else
              echo 'No Clang deep profile was captured.'
            fi
            echo ''
            echo '### Gradle plugin: largest paths'
            if [ -s /tmp/rbe-test/gradle-detail.log ]; then
              echo '```text'
              tail -n 10 /tmp/rbe-test/gradle-detail.log
              echo '```'
            else
              echo 'No Gradle deep profile was captured.'
            fi
            echo ''
            echo '### Platform Git objects: largest paths'
            if [ -s /tmp/rbe-test/platform-objects-detail.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/platform-objects-detail.log
              echo '```'
            else
              echo 'No platform Git-object deep profile was captured.'
            fi
            echo ''
            if [ -s /tmp/rbe-test/prebuilts-projects.log ]; then
              echo "Prebuilts projects listed in manifest: **$(wc -l < /tmp/rbe-test/prebuilts-projects.log)**."
            else
              echo 'No prebuilts manifest project list was captured.'
            fi
            echo 'Storage profiling did not modify source or Git objects.'
            echo ''
            echo '### P0 reclient trim'
            if [ -s /tmp/rbe-test/p0-storage-trim-status.txt ]; then
              cat /tmp/rbe-test/p0-storage-trim-status.txt
            else
              echo 'P0 trim did not finish; see diagnostic artifact.'
            fi
            if [ -s /tmp/rbe-test/p0-reclient-size.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/p0-reclient-size.txt
              echo '```'
            fi
            echo ''
            echo '### Configure stage (P0.1 diagnostics)'
            if [ -s /tmp/rbe-test/configure-failure.txt ]; then
              echo '**The configure/build step exited with an error:**'
              echo '```text'
              cat /tmp/rbe-test/configure-failure.txt
              echo '```'
            elif [ -s /tmp/rbe-test/configure-success.txt ]; then
              echo 'Configure/build step completed successfully.'
            else
              echo 'Configure/build step did not record a final exit status.'
            fi
            if [ -s /tmp/rbe-test/configure-stages.log ]; then
              echo '```text'
              tail -n 20 /tmp/rbe-test/configure-stages.log
              echo '```'
            fi
            echo ''
            echo '### ROM output'
            if [ -s /tmp/rbe-test/rom-filename.txt ]; then
              echo "ROM ZIP: **$(cat /tmp/rbe-test/rom-filename.txt)**"
              echo ''
              echo '```text'
              cat /tmp/rbe-test/rom-sha256.txt 2>/dev/null || true
              echo '```'
            else
              echo 'No verified ROM ZIP created in this run.'
            fi
            if [ -s /tmp/rbe-test/time-stop-triggered.txt ]; then
              echo '**Soft job deadline triggered; build stopped to retain diagnostics.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo '=== FINAL DISK AND MEMORY ==='
          df -h / /home/runner/work/los || true
          free -h || true

          echo '=== POST-BUILD OUTPUT STORAGE ==='
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            du -sh /home/runner/work/los/.repo /home/runner/work/los/out \
              2>/dev/null || true
            du -xhd1 /home/runner/work/los/out 2>/dev/null \
              | sort -h | tail -n 35 || true
          } 2>&1 | tee /tmp/rbe-test/disk-analysis-post-build.log

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo '=== CONFIGURE / LUNCH FAILURE SUMMARY ==='
          cat /tmp/rbe-test/configure-failure.txt 2>/dev/null || true
          echo '=== CONFIGURE STAGES ==='
          cat /tmp/rbe-test/configure-stages.log 2>/dev/null || true
          echo '=== CONFIGURE LOG TAIL (LAST 180 LINES) ==='
          tail -n 180 /tmp/rbe-test/configure-setup.log 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true
          echo "=== STORAGE PROFILE SAMPLING ==="
          tail -n 30 /tmp/rbe-test/resource-samples.tsv 2>/dev/null || true
          echo "=== RESOURCE MONITOR ==="
          tail -n 60 /tmp/rbe-test/resource-monitor.log 2>/dev/null || true

          echo '=== PREBUILTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/prebuilts-detail.log 2>/dev/null || true
          echo '=== REPO METADATA LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/repo-size.log 2>/dev/null || true
          echo '=== CLANG TOOLCHAINS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/clang-detail.log 2>/dev/null || true
          echo '=== GRADLE PLUGIN LARGEST DIRECTORIES ==='
          tail -n 15 /tmp/rbe-test/gradle-detail.log 2>/dev/null || true
          echo '=== PLATFORM GIT OBJECTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/platform-objects-detail.log 2>/dev/null || true
          echo '=== PREBUILTS MANIFEST PROJECT COUNT ==='
          wc -l /tmp/rbe-test/prebuilts-projects.log 2>/dev/null || true

          echo "=== REPROXY LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/reproxy_log.txt 2>/dev/null || true

          echo "=== ALL AVAILABLE RECLIENT LOGS ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            \( -iname '*log*' -o -name '*.rpl' -o -iname '*metrics*' \) \
            -printf '%p %s bytes\n' | sort || true

          echo "=== RBE ERROR SUMMARY ==="
          grep -aRinE \
            'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
            /tmp/rbe-test \
            --exclude=full-rom-build.log \
            --exclude=m-nothing.log \
            2>/dev/null | head -100 || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== FULL ROM BUILD LOG TAIL ==="
          tail -n 260 /tmp/rbe-test/full-rom-build.log 2>/dev/null || true
          echo "=== BUILD STOP REASONS ==="
          cat /tmp/rbe-test/*-stop-triggered.txt 2>/dev/null || true
          echo "=== ROM ZIP FILES IF PRESENT ==="
          find /home/runner/work/los/out/target/product/star2lte -maxdepth 1 \
            -type f -name 'lineage-*.zip' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Redact BuildBuddy API key from RBE artifacts
        if: always()
        shell: bash
        run: |
          set -e
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path

          key = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          root = Path("/tmp/rbe-test")
          if key and root.is_dir():
              for file in root.rglob("*"):
                  if not file.is_file() or file.is_symlink():
                      continue
                  data = file.read_bytes()
                  if key in data:
                      # Preserve file length for binary diagnostic formats.
                      file.write_bytes(data.replace(key, b"*" * len(key)))
                      print(f"Redacted secret from: {file.relative_to(root)}")
          PYREDACT

      - name: Upload full ROM trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7
